[project]
name = "facade-modeler"
version = "0.1.0"
description = "照片 → 细节立面建模：HouseSpec、照片矫正、GLB 生成，供 LM 通过 MCP 调用"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.9",
    "mcp>=2.3,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
facade-modeler-mcp = "facade_modeler.adapters.mcp_server:main"
facade-modeler-http = "facade_modeler.adapters.http_server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facade_modeler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
