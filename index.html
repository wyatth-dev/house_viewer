<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>House & Ground — Define your property</title>
    </head>
    <body>
        <div id="home" class="home" hidden></div>
        <main class="workspace">
            <section id="viewport" aria-label="House and property preview">
                <canvas id="application-canvas" aria-label="3D house preview"></canvas>
                <div class="scene-header">
                    <a class="brand" href="/">HOUSE <span>&</span> GROUND</a><span class="stage">SCENE BUILDER</span>
                </div>
                <div id="measurements" aria-label="Property measurements"></div>
                <div class="scene-caption">
                    <span class="live-dot"></span><span id="active-view">Front view</span
                    ><span class="caption-separator">/</span><span id="projection-label">Perspective</span>
                </div>
                <div id="status" role="status" aria-live="polite">Preparing your house…</div>
            </section>
            <aside id="panel" aria-label="Scene configuration"></aside>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
