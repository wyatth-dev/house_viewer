<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Varenda — Customization & Production List</title>
    </head>
    <body>
        <main class="product-page">
            <section class="product-viewport" aria-label="Product 3D preview">
                <canvas id="lab-canvas" aria-label="3D veranda preview"></canvas>
                <header class="product-header">
                    <a class="brand" href="/">HOUSE <span>&</span> GROUND</a
                    ><span class="product-stage">VARENDA / PRODUCT PREVIEW</span>
                </header>
                <div class="viewport-toolbar">
                    <button id="fit-product" class="secondary-button" type="button">Overview</button
                    ><label class="detail-toggle"><input id="glazing-details" type="checkbox" /> Glazing details</label>
                </div>
                <div id="selection-caption" class="selection-caption" aria-live="polite">All components</div>
            </section>
            <div id="product-panel" class="product-panel"></div>
            <p id="lab-status" class="page-status" role="status" aria-live="polite">Preparing your veranda…</p>
        </main>
        <script type="module" src="/src/customization/main.ts"></script>
    </body>
</html>
