# Render options: one group per {parameter} in render.txt.
# - label / default: shown in the Rendering panel.
# - each option: label (button text), icon (optional, see src/rendering/options-panel.ts), text (goes into the prompt).
# Add an option: add a block. Add a parameter: add a group here and write {its_id} in render.txt.
# Read again for every render and every time the Rendering step opens; no restart needed.

[style]
label = "Style"
default = "commercial"

[style.options.commercial]
label = "Commercial"
icon = "sparkle"
text = "a photorealistic commercial architectural rendering"

[style.options.photo]
label = "Photo"
icon = "camera"
text = "a natural real-estate photograph"

[style.options.illustration]
label = "Illustration"
icon = "brush"
text = "a soft architectural illustration of the existing surfaces"

[time_of_day]
label = "Time of day"
default = "day"

[time_of_day.options.day]
label = "Day"
icon = "sun"
text = "soft natural daylight"

[time_of_day.options.golden]
label = "Golden hour"
icon = "sunset"
text = "warm amber illumination on existing surfaces and warm sky colour; keep the existing projected edges and shadows' attachment points"

[time_of_day.options.dusk]
label = "Dusk"
icon = "moon"
text = "blue-hour dusk light and warm light through existing glazing"

[weather]
label = "Weather"
default = "clear"

[weather.options.clear]
label = "Clear"
icon = "sun"
text = "clear sky with a few light clouds; dry existing surfaces"

[weather.options.overcast]
label = "Overcast"
icon = "cloud"
text = "cloud-covered sky and diffuse light on existing surfaces"

[weather.options.after-rain]
label = "After rain"
icon = "rain"
text = "light moisture and subtle reflections on existing ground surfaces; keep the same ground layout"

[season]
label = "Season"
default = "summer"

[season.options.spring]
label = "Spring"
icon = "flower"
text = "fresh green foliage and light blossom on background plants"

[season.options.summer]
label = "Summer"
icon = "leaf"
text = "green lawn and leafy background plants"

[season.options.autumn]
label = "Autumn"
icon = "maple"
text = "warm-coloured background foliage and a few fallen leaves on existing lawn"

[season.options.winter]
label = "Winter"
icon = "snow"
text = "bare background branches and a light frost on existing lawn; no thick snow"
