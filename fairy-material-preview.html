<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Fairy house · material comparison</title>
        <style>
            body {
                margin: 0;
                background: #f1f3f5;
                font: 14px system-ui;
                color: #263d33;
            }
            canvas {
                width: 100vw;
                height: 100vh;
                display: block;
            }
            nav {
                position: absolute;
                top: 20px;
                left: 20px;
                display: flex;
                gap: 8px;
            }
            button {
                padding: 10px 16px;
                border: 1px solid #bfc7c1;
                border-radius: 6px;
                background: white;
            }
            button[aria-pressed='true'] {
                background: #284b3e;
                color: white;
            }
            #status {
                position: absolute;
                bottom: 20px;
                left: 20px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <nav>
            <button data-model="model.glb">White</button><button data-model="color-block/model.glb">Color blocks</button
            ><button data-model="render/model.glb">Detailed render</button><button id="front">Front</button
            ><button id="rear">Rear</button>
        </nav>
        <div id="status">Loading…</div>
        <script type="module">
            import * as pc from 'playcanvas';
            const app = new pc.Application(document.querySelector('canvas'));
            app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
            app.setCanvasResolution(pc.RESOLUTION_AUTO);
            app.scene.ambientLight = new pc.Color(0.48, 0.49, 0.5);
            app.scene.skyboxIntensity = 0.55;
            const camera = new pc.Entity('Preview camera');
            camera.addComponent('camera', {
                clearColor: new pc.Color(0.95, 0.96, 0.97),
                nearClip: 100,
                farClip: 200000,
                toneMapping: pc.TONEMAP_ACES
            });
            app.root.addChild(camera);
            const sun = new pc.Entity('Sun');
            sun.addComponent('light', {
                type: 'directional',
                intensity: 1.5,
                castShadows: true,
                shadowResolution: 4096,
                shadowDistance: 90000,
                shadowBias: 0.2,
                normalOffsetBias: 0.5
            });
            sun.setEulerAngles(48, -35, 0);
            app.root.addChild(sun);
            const ground = new pc.Entity('Ground');
            const mat = new pc.StandardMaterial();
            mat.diffuse = new pc.Color(0.88, 0.89, 0.9);
            mat.gloss = 0;
            mat.update();
            ground.addComponent('render', { type: 'plane', material: mat, castShadows: false });
            ground.setLocalScale(200000, 1, 200000);
            ground.setPosition(-6858, -100, -8788);
            app.root.addChild(ground);
            let model, loadedAsset;
            let yaw = 0.65,
                pitch = 0.3,
                distance = 30000;
            const center = new pc.Vec3(-6858, 2300, -8788);
            function frame() {
                camera.setPosition(
                    center.x + distance * Math.sin(yaw) * Math.cos(pitch),
                    center.y + distance * Math.sin(pitch),
                    center.z + distance * Math.cos(yaw) * Math.cos(pitch)
                );
                camera.lookAt(center);
            }
            frame();
            async function load(path) {
                document.querySelector('#status').textContent = 'Loading…';
                const asset = await new Promise((resolve, reject) =>
                    app.assets.loadFromUrl('/scenes/typology/fairy-house/' + path, 'container', (err, a) =>
                        err ? reject(err) : resolve(a)
                    )
                );
                const next = asset.resource.instantiateRenderEntity();
                const floor = next.findByName('Restored house floor');
                if (floor) floor.enabled = false;
                next.forEach((n) => {
                    if (n.render) {
                        n.render.castShadows = true;
                        n.render.receiveShadows = true;
                    }
                });
                if (model) model.destroy();
                if (loadedAsset) {
                    loadedAsset.unload();
                    app.assets.remove(loadedAsset);
                }
                model = next;
                loadedAsset = asset;
                app.root.addChild(model);
                document.querySelector('#status').textContent =
                    'Aligned reference coordinates · drag to orbit · wheel to zoom';
                document
                    .querySelectorAll('[data-model]')
                    .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.model === path)));
            }
            document.querySelectorAll('[data-model]').forEach((b) => (b.onclick = () => load(b.dataset.model)));
            document.querySelector('#front').onclick = () => {
                yaw = 0.65;
                pitch = 0.3;
                frame();
            };
            document.querySelector('#rear').onclick = () => {
                yaw = 3.8;
                pitch = 0.3;
                frame();
            };
            let down = false,
                last;
            const canvas = document.querySelector('canvas');
            canvas.onpointerdown = (e) => {
                down = true;
                last = [e.clientX, e.clientY];
                canvas.setPointerCapture(e.pointerId);
            };
            canvas.onpointermove = (e) => {
                if (!down) return;
                yaw -= (e.clientX - last[0]) * 0.005;
                pitch = Math.max(0.03, Math.min(1.3, pitch + (e.clientY - last[1]) * 0.005));
                last = [e.clientX, e.clientY];
                frame();
            };
            canvas.onpointerup = () => (down = false);
            canvas.onwheel = (e) => {
                e.preventDefault();
                distance = Math.max(13000, Math.min(80000, distance * Math.exp(e.deltaY * 0.001)));
                frame();
            };
            window.onresize = () => app.resizeCanvas();
            app.start();
            load('render/model.glb');
        </script>
    </body>
</html>
